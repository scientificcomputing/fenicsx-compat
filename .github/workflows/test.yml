name: Test package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-code:
    name: Test on ${{ matrix.label }} (${{ matrix.scalar }})
    runs-on: ubuntu-24.04
    container: ghcr.io/fenics/dolfinx/dolfinx:${{ matrix.label }}
    env:
      DEB_PYTHON_INSTALL_LAYOUT: deb_system
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
    strategy:
      fail-fast: false
      matrix:
        label: ["nightly", "stable", "v0.10.0"]
        scalar: ["real", "complex"]

    steps:
      - uses: actions/checkout@v7

      # Source the image's own script, as its install paths differ between versions
      - name: Switch to complex mode
        if: matrix.scalar == 'complex'
        shell: bash
        run: |
          . /usr/local/bin/dolfinx-complex-mode
          for var in PKG_CONFIG_PATH CMAKE_PREFIX_PATH PETSC_ARCH PYTHONPATH LD_LIBRARY_PATH; do
            echo "${var}=${!var}" >> "$GITHUB_ENV"
          done

      # Fail rather than silently testing the real build
      - name: Check scalar type
        run: >-
          python3 -c "import numpy as np, dolfinx;
          print(dolfinx.__file__, dolfinx.default_scalar_type);
          assert np.issubdtype(dolfinx.default_scalar_type, np.complexfloating)
          == ('${{ matrix.scalar }}' == 'complex')"

      - name: Update pip
        run: python3 -m pip install --upgrade pip

      - name: Install package
        run: python3 -m pip install ".[test]"

      - name: Run tests (serial)
        run: python3 -m pytest -v

      - name: Run tests (parallel)
        run: mpirun -n 2 python3 -m pytest -v -m "not serial"
