# .github/docs-versions.yml
#
# Maps each fenicsx-compat minor version series to:
#   - the fenicsx-compat git tag to build docs from (latest patch of that minor)
#   - the dolfinx Docker image to build them in
#
# "main" is always built against dolfinx nightly and is not listed here;
# it is handled automatically by .github/workflows/deploy_docs.yml.
#
# Releasing (`bump-my-version bump release`, see pyproject.toml) updates this file:
#   - a new minor version (e.g. v0.3.0) gets a new entry at the top, in the
#     dolfinx image of the previous entry; update that image by hand if needed.
#   - a patch (e.g. v0.3.1) replaces the tag of its minor's entry, as old
#     patch docs are intentionally replaced (only one slot per minor).
# Those rules match the top entry in this exact layout and key order.

versions:
  - tag: "v0.6.0"
    minor: "v0.6"
    dolfinx_image: "ghcr.io/fenics/dolfinx/dolfinx:v0.11.0"
  - tag: "v0.5.0"
    minor: "v0.5"
    dolfinx_image: "ghcr.io/fenics/dolfinx/dolfinx:v0.11.0"
  - tag: "v0.4.0"
    minor: "v0.4"
    dolfinx_image: "ghcr.io/fenics/dolfinx/dolfinx:v0.11.0"
  - tag: "v0.3.0"
    minor: "v0.3"
    dolfinx_image: "ghcr.io/fenics/dolfinx/dolfinx:v0.11.0"
  - tag: "v0.2.0"
    minor: "v0.2"
    dolfinx_image: "ghcr.io/fenics/dolfinx/dolfinx:v0.11.0"
