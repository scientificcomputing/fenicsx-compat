[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fenicsx-compat"
version = "0.7.0.dev0"
description = "Cross-version compatibility helpers for DOLFINx (FEniCSx)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Henrik N.T. Finsberg", email = "henriknf@simula.no" },
    { name = "Jørgen S. Dokken", email = "dokken@simula.no" },
]
dependencies = ["fenics-dolfinx>=0.10.0", "packaging"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pre-commit", "bump-my-version"]
test = ["pytest", "petsc4py"]
docs = ["jupyter-book<2.0"]
all = ["fenicsx-compat[dev,test,docs]"]

[dependency-groups]
# Keep in sync with [build-system].requires above.
build = ["hatchling"]

[tool.hatch.build]
# Editable installs add src/ to sys.path with a .pth file, so they do not
# need the editables package when building without build isolation.
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "serial: single-rank only, excluded from the mpirun leg",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I001"]
ignore = ["E402", "E741", "E743"]

[tool.ruff.lint.isort]
known-first-party = ["fenicsx_compat"]
known-third-party = ["basix", "dolfinx", "ffcx", "ufl", "numpy", "pytest"]
section-order = ["future", "standard-library", "mpi", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
mpi = ["mpi4py", "petsc4py"]

[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "0.7.0.dev0"
# X.Y.Z.devN while developing, X.Y.Z when released
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.(?P<release>dev)(?P<pre_n>\d+))?'
serialize = ["{major}.{minor}.{patch}.{release}{pre_n}", "{major}.{minor}.{patch}"]

[tool.bumpversion.parts.release]
# "final" is the released state: never written in the version, reached with `bump release`
values = ["dev", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
# Anchored, so it is the [project] version and not current_version
regex = true
search = '^version = "{current_version}"$'
replace = 'version = "{new_version}"'

# Releasing a new minor version (`bump release` to X.Y.0) adds its documentation version, built
# in the DOLFINx image of the previous minor release. Update that image if a newer DOLFINx
# release is stable.
[[tool.bumpversion.files]]
filename = ".github/docs-versions.yml"
include_bumps = ["release"]
ignore_missing_version = true
regex = true
search = '^versions:\n(?P<last>  - tag: "[^"]+"\n    minor: "(?!v{new_major}\.{new_minor}")[^"]+"\n    dolfinx_image: "(?P<image>[^"]+)"\n)'
replace = 'versions:\n  - tag: "v{new_version}"\n    minor: "v{new_major}.{new_minor}"\n    dolfinx_image: "\g<image>"\n\g<last>'

# Releasing a patch (`bump release` to X.Y.Z, Z > 0) replaces the docs of its minor version
[[tool.bumpversion.files]]
filename = ".github/docs-versions.yml"
include_bumps = ["release"]
ignore_missing_version = true
regex = true
search = '^versions:\n  - tag: "[^"]+"\n(?P<rest>    minor: "v{new_major}\.{new_minor}"\n)'
replace = 'versions:\n  - tag: "v{new_version}"\n\g<rest>'
